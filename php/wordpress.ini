; php/uploads.ini - PHP settings for WordPress file uploads

; Maximum file upload size
upload_max_filesize = 64M

; Maximum POST data size (should be >= upload_max_filesize)
post_max_size = 64M

; Maximum execution time for PHP scripts (seconds)
max_execution_time = 300

; Maximum input time
max_input_time = 300

; Memory limit per script
memory_limit = 256M

; Disable open_basedir restrictions in development
open_basedir = none

; Update PHP error logging to point to the Linux container environment
error_log = /var/log/php_errors.log
