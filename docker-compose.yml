# docker-compose.yml - Wordpress with PHP-FPM and MySQL
services:
  culturalskies-wp:
    image: erikngigi/wordpress-php8.3-fpm:dev
    container_name: culturalskies-wp
    restart: unless-stopped
    volumes:
      - /home/eric/culturalskies-data:/var/www/html
      - ./php/custom-settings.ini:/usr/local/etc/php/conf.d/custom-settings.ini:ro
      - ./wordpress/settings/php/php.ini-development:/usr/local/etc/php/php.ini:ro
      - ./wordpress/settings/php-fpm/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ./wordpress/settings/php-fpm/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
    ports:
      - 9001:9000
    env_file:
      - .env1
    depends_on:
      wp-mariadb:
        condition: service_healthy
    networks:
      - wordpress-network

  deauraustinchicago-wp:
    image: erikngigi/wordpress-php8.3-fpm:dev
    container_name: deauraustinchicago-wp
    restart: unless-stopped
    volumes:
      - /home/eric/deauraustinchicago-data:/var/www/html
      - ./php/custom-settings.ini:/usr/local/etc/php/conf.d/custom-settings.ini:ro
      - ./wordpress/settings/php/php.ini-development:/usr/local/etc/php/php.ini:ro
      - ./wordpress/settings/php-fpm/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ./wordpress/settings/php-fpm/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
    ports:
      - 9002:9000
    env_file:
      - .env2
    depends_on:
      wp-mariadb:
        condition: service_healthy
    networks:
      - wordpress-network

  wp-mariadb:
    image: mariadb:11.4
    container_name: wordpress-mariadb
    restart: unless-stopped
    volumes:
      - wordpress-mariadb-data:/var/lib/mysql
      - ./wordpress/settings/mysql/wordpress.cnf:/etc/mysql/conf.d/wordpress.cnf:ro
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${CS_MARIADB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${CS_MARIADB_DATABASE_NAME}
      MYSQL_USER: ${CS_MARIADB_USER}
      MYSQL_PASSWORD: ${CS_MARIADB_USER_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wordpress-network

networks:
  wordpress-network:
    name: wordpress-network
    driver: bridge

volumes:
  wordpress-mariadb-data:
    name: wordpress-mariadb-data
    driver: local
