# docker-compose.yml - Wordpress with PHP-FPM and MySQL
services:
  webserver:
    image: nginx:alpine
    container_name: wordpress-webserver
    restart: unless-stopped
    ports:
      - 8080:80
    environment:
      WP_HOST: wordpress
      WP_PORT: 9000
      SERVER_NAME: localhost
    volumes:
      - ./src/wordpress-data:/var/www/html
      - ./nginx/dev.culturalskies.conf.template:/etc/nginx/templates/dev.culturalskies.conf.template:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - wordpress
    networks:
      - wordpress-network

  wordpress:
    image: erikngigi/wordpress-php8.3-fpm:latest
    container_name: wordpress
    restart: unless-stopped
    volumes:
      # Wordpress installation files
      - ./src/wordpress-data:/var/www/html
      # Custom PHP settings for uploads
      - ./php/custom-settings.ini:/usr/local/etc/php/conf.d/custom-settings.ini:ro
    ports:
      - 9000:9000
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      # Security keys - generated at https://api.wordpress.org/secret-key/1.1/salt/
      WORDPRESS_AUTH_KEY: ${WP_AUTH_KEY}
      WORDPRESS_SECURE_AUTH_KEY: ${WP_SECURE_AUTH_KEY}
      WORDPRESS_LOGGED_IN_KEY: ${WP_LOGGED_IN_KEY}
      WORDPRESS_NONCE_KEY: ${WP_NONCE_KEY}
      WORDPRESS_AUTH_SALT: ${WP_AUTH_SALT}
      WORDPRESS_SECURE_AUTH_SALT: ${WP_SECURE_AUTH_SALT}
      WORDPRESS_LOGGED_IN_SALT: ${WP_LOGGED_IN_SALT}
      WORDPRESS_NONCE_SALT: ${WP_NONCE_SALT}
      # Table prefix
      WORDPRESS_TABLE_PREFIX: wp_
    depends_on:
      wp-mariadb:
        condition: service_healthy
    networks:
      - wordpress-network

  wp-mariadb:
    image: mariadb:11.4
    container_name: wordpress-mariadb
    restart: unless-stopped
    volumes:
      - wordpress-mariadb-data:/var/lib/mysql
      - ./mysql/wordpress.cnf:/etc/mysql/conf.d/wordpress.cnf:ro
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${CS_MARIADB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${CS_MARIADB_DATABASE_NAME}
      MYSQL_USER: ${CS_MARIADB_USER}
      MYSQL_PASSWORD: ${CS_MARIADB_USER_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wordpress-network

networks:
  wordpress-network:
    name: wordpress-network
    driver: bridge

volumes:
  wordpress-mariadb-data:
    name: wordpress-mariadb-data
    driver: local
