# docker-compose.yml - Wordpress with PHP-FPM and MySQL
services:
  webserver:
    image: nginx:alpine
    container_name: wordpress-webserver
    restart: unless-stopped
    ports:
      - 8080:80
      - 8081:81
    volumes:
      - ./wp-multisite-storage:/var/www/html:ro
      - ./settings/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - wordpress1
      - wordpress2
    networks:
      - wordpress-network

  wordpress1:
    image: erikngigi/wordpress-php8.3:local
    container_name: wordpress1
    restart: unless-stopped
    volumes:
      - ./wp-multisite-storage/site1:/var/www/html
      - ./settings/php/custom.ini:/usr/local/etc/php/conf.d/custom-settings.ini:ro
    environment:
      WORDPRESS_DB_HOST: wp-mariadb
      WORDPRESS_DB_NAME: ${SITE1_DB_NAME}
      WORDPRESS_DB_USER: ${SITE1_DB_USER}
      WORDPRESS_DB_PASSWORD: ${SITE1_DB_PASSWORD}
      # Security keys - generated at https://api.wordpress.org/secret-key/1.1/salt/
      WORDPRESS_AUTH_KEY: ${WP_AUTH_KEY}
      WORDPRESS_SECURE_AUTH_KEY: ${WP_SECURE_AUTH_KEY}
      WORDPRESS_LOGGED_IN_KEY: ${WP_LOGGED_IN_KEY}
      WORDPRESS_NONCE_KEY: ${WP_NONCE_KEY}
      WORDPRESS_AUTH_SALT: ${WP_AUTH_SALT}
      WORDPRESS_SECURE_AUTH_SALT: ${WP_SECURE_AUTH_SALT}
      WORDPRESS_LOGGED_IN_SALT: ${WP_LOGGED_IN_SALT}
      WORDPRESS_NONCE_SALT: ${WP_NONCE_SALT}
      WORDPRESS_TABLE_PREFIX: site1_
    depends_on:
      wp-mariadb:
        condition: service_healthy
    networks:
      - wordpress-network

  wordpress2:
    image: erikngigi/wordpress-php8.3:local
    container_name: wordpress2
    restart: unless-stopped
    volumes:
      - ./wp-multisite-storage/site2:/var/www/html
      - ./settings/php/custom.ini:/usr/local/etc/php/conf.d/custom-settings.ini:ro
    environment:
      WORDPRESS_DB_HOST: wp-mariadb
      WORDPRESS_DB_NAME: ${SITE2_DB_NAME}
      WORDPRESS_DB_USER: ${SITE2_DB_USER}
      WORDPRESS_DB_PASSWORD: ${SITE2_DB_PASSWORD}
      # Security keys - generated at https://api.wordpress.org/secret-key/1.1/salt/
      WORDPRESS_AUTH_KEY: ${WP_AUTH_KEY}
      WORDPRESS_SECURE_AUTH_KEY: ${WP_SECURE_AUTH_KEY}
      WORDPRESS_LOGGED_IN_KEY: ${WP_LOGGED_IN_KEY}
      WORDPRESS_NONCE_KEY: ${WP_NONCE_KEY}
      WORDPRESS_AUTH_SALT: ${WP_AUTH_SALT}
      WORDPRESS_SECURE_AUTH_SALT: ${WP_SECURE_AUTH_SALT}
      WORDPRESS_LOGGED_IN_SALT: ${WP_LOGGED_IN_SALT}
      WORDPRESS_NONCE_SALT: ${WP_NONCE_SALT}
      # Table prefix
      WORDPRESS_TABLE_PREFIX: site2_
    depends_on:
      wp-mariadb:
        condition: service_healthy
    networks:
      - wordpress-network

  wp-mariadb:
    image: mariadb:11.4
    container_name: wordpress-mariadb
    restart: unless-stopped
    volumes:
      - wordpress-mariadb-data:/var/lib/mysql
      - ./settings/mysql/wordpress.cnf:/etc/mysql/conf.d/wordpress.cnf:ro
      - ./settings/mysql:/docker-entrypoint-initdb.d
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wordpress-network

networks:
  wordpress-network:
    name: wordpress-network
    driver: bridge

volumes:
  wordpress-mariadb-data:
    name: wordpress-mariadb-data
    driver: local
