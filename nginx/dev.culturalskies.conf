# ==============================================================================
# UPSTREAM DEFINITION
# ==============================================================================

# WordPress PHP-FPM Container (Point to host-bound port e.g. 9000 or 9001)
upstream wordpress_backend {
    server 127.0.0.1:9000;
}

# ==============================================================================
# WORDPRESS SITE (dev.culturalskies.ericngigi.com)
# ==============================================================================

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name dev.culturalskies.ericngigi.com;
    return 301 https://$host$request_uri;
}

# 2. Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.culturalskies.ericngigi.com;

    # Host mount path for WordPress root files
    root /home/eric/docker-wordpress-stack/src/cs-wordpress;
    index index.php index.html;

    # SSL Certificate Paths
    ssl_certificate /etc/letsencrypt/live/dev.culturalskies.ericngigi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.culturalskies.ericngigi.com/privkey.pem;

    # Dedicated Access & Error Logs
    access_log /var/log/nginx/dev.culturalskies.ericngigi.access.log;
    error_log /var/log/nginx/dev.culturalskies.ericngigi.error.log;

    # TLS Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;

    client_max_body_size 64M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Main Location Block (WordPress Permalinks support)
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass PHP requests to PHP-FPM container
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress_backend;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Informs WordPress that connection is HTTPS to prevent redirect loops
        fastcgi_param HTTPS on;

        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Cache Static Assets for 30 Days
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Restrict Access to Sensitive Files
    location ~ /\.ht {
        deny all;
    }

    location = /wp-config.php {
        deny all;
    }

    location ~* /xmlrpc\.php$ {
        deny all;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
