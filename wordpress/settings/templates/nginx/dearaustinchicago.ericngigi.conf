# ==============================================================================
# UPSTREAM DEFINITION
# ==============================================================================

# WordPress PHP-FPM Container (Point to host-bound port e.g. 9000 or 9001)
upstream wordpress_backend {
    server 127.0.0.1:9000;
}

server {
    listen 80;
    listen [::]:80;
    server_name dearaustinchicago.ericngigi.com;
    return 301 https://$host$request_uri;
}

# 2. Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dearaustinchicago.ericngigi.com;

    # SSL Certificate Paths
    ssl_certificate /etc/letsencrypt/live/dearaustinchicago.ericngigi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dearaustinchicago.ericngigi.com/privkey.pem;

    # Main Location Block (WordPress Permalinks support)
    # Proxy Headers (CRITICAL for WordPress URL generation & HTTPS detection)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass wordpress_backend;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }
}
