# ==============================================================================
# UPSTREAM DEFINITION (Points to Container Nginx Published Port 8080)
# ==============================================================================
upstream wordpress_backend {
    server 127.0.0.1:8080;
}

# 1. HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dearaustinchicago.ericngigi.com;

    return 301 https://$host$request_uri;
}

# 2. Main HTTPS Server Block (SSL Termination)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dearaustinchicago.ericngigi.com;

    # SSL Certificate Paths
    ssl_certificate /etc/letsencrypt/live/dearaustinchicago.ericngigi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dearaustinchicago.ericngigi.com/privkey.pem;

    location / {
        proxy_pass http://wordpress_backend;

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }
}
